server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

  # Assets com hash → cache longo e imutável
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # favicon
  location = /favicon.ico {
    expires 7d;
    try_files $uri =404;
  }

  # Páginas prerenderizadas: serve o HTML direto, sem cache forte
  # (para que mudanças no deploy apareçam rapidamente)
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    # tenta arquivo exato → diretório com index.html → fallback para SPA
    try_files $uri $uri/index.html $uri.html /index.html;
  }
}
