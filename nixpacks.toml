[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --legacy-peer-deps"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "sh -c 'if [ -f dist/server/server.js ]; then npx -y srvx@latest --prod -s dist/client dist/server/server.js --port ${PORT:-3000} --host 0.0.0.0; elif [ -f dist/client/index.html ]; then npx -y serve@latest -s dist/client -l tcp://0.0.0.0:${PORT:-3000}; else npx -y serve@latest -s dist -l tcp://0.0.0.0:${PORT:-3000}; fi'"
